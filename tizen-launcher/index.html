<!DOCTYPE html>
<html lang="es">

  <meta name="viewport" content="width=1920, height=1080">
  <title>Hogar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="shelf">
    <div class="shelf-art" id="artA"></div>
    <div class="shelf-art" id="artB"></div>
    <div class="shelf-scrim"></div>

      <div class="shelf-kicker" id="shelfKicker"></div>

      <p class="shelf-desc" id="shelfDesc"></p>
      <div class="shelf-actions"><span class="pill" id="shelfAction"></span><span class="shelf-meta" id="shelfMeta"></span></div>
    </div>
  </div>
  <div id="frost"></div>

  <main id="home"></main>

  <div id="toast" class="toast"></div>
